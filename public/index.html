
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search D1 Database</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 0 16px;
    }

    #search {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>Search Characters</h1>

  <input
    type="search"
    id="search"
    placeholder="Search by name..."
    autocomplete="off"
  >

  <p id="status">Loading database...</p>

  <table id="items">
    <thead>
      <tr>
        <th>Name</th>
        <th>Code</th>
        <th>Au</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>

  <script>
    const API_URL = "https://worker.rrrase-holden.workers.dev/";

    const searchInput = document.getElementById("search");
    const results = document.getElementById("results");
    const status = document.getElementById("status");

    let characters = [];

    async function loadItems() {
      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        characters = Array.isArray(data)
          ? data
          : data.results ?? data.data ?? [];

        displayItems(characters);
      } catch (error) {
        console.error("Database error:", error);
        status.textContent = "Failed to load database.";
      }
    }

    function displayItems(items) {
      // Clear only the table body, keeping the headers intact.
      results.replaceChildren();

      if (items.length === 0) {
        status.textContent = "No codes found";
        return;
      }

      status.textContent = `${items.length} codes found`;

      for (const item of items) {
        const row = document.createElement("tr");

        for (const value of [
          item.Name ?? item.name ?? "",
          item.Code ?? item.code ?? "",
          item.Au ?? item.au ?? ""
        ]) {
          const td = document.createElement("td");
          td.textContent = String(value);
          row.appendChild(td);
        }

        results.appendChild(row);
      }
    }

    searchInput.addEventListener("input", () => {
      const query = searchInput.value
        .trim()
        .toLowerCase();

      const filtered = characters.filter(item => {
        const name = String(item.Name ?? item.name ?? "")
          .normalize("NFKC")
          .trim()
          .toLowerCase();

        return name.includes(query);
      });

      displayItems(filtered);
    });

    loadItems();
  </script>
</body>
</html>
