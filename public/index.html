
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Search D1 Database</title>
</head>
<body>
  <h1>Search Characters</h1>

  <input
    type="search"
    id="search"
    placeholder="Search by name..."
    autocomplete="off"
  >

  <p id="status">Loading database...</p>
  <ul id="items"></ul>


<script>
  const API_URL = "https://worker.rrrase-holden.workers.dev/";

  const searchInput = document.getElementById("search");
  const itemsList = document.getElementById("items");
  const status = document.getElementById("status");

  let characters = [];

  async function loadItems() {
    status.textContent = "Loading database...";

    try {
      const response = await fetch(API_URL);
      console.log("HTTP status:", response.status);

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();
      console.log("API response:", data);

      // Your API may return an array directly or wrap it in an object.
      characters = Array.isArray(data)
        ? data
        : data.results ?? data.data ?? [];

      console.log("Loaded records:", characters.length);
      console.log("First record:", characters[0]);

      displayItems(characters);
    } catch (error) {
      console.error("Failed to load database:", error);
      status.textContent = "Failed to load database. Check console.";
    }
  }

  function displayItems(items) {
    itemsList.replaceChildren();

    if (items.length === 0) {
      status.textContent = "No matching records found.";
      return;
    }

    status.textContent = `${items.length} record(s) found`;

    for (const item of items) {
      const li = document.createElement("li");

      li.textContent =
        `${item.Name ?? item.name ?? "Unnamed"} | ` +
        `Code: ${item.Code ?? item.code ?? ""} | ` +
        `Au: ${item.Au ?? item.au ?? ""}`;

      itemsList.appendChild(li);
    }
  }

  searchInput.addEventListener("input", () => {
    const query = searchInput.value.trim().toLowerCase();

    const filtered = characters.filter(item => {
      // Convert the name to a string and ignore capitalization/spacing.
      const name = String(item.Name ?? item.name ?? "")
        .normalize("NFKC")
        .trim()
        .toLowerCase();

      return name.includes(query);
    });

    displayItems(filtered);
  });

  loadItems();
</script>

</body>
</html>
