
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Search D1 Database</title>
</head>
<body>
  <h1>Search Characters</h1>

  <input
    type="search"
    id="search"
    placeholder="Search by name..."
    autocomplete="off"
  >

  <p id="status">Loading database...</p>
  <table id="items">
  <thead>
    <tr>
      <th>Name</th>
      <th>Code</th>
      <th>Au</th>
    </tr>
  </thead>
  <tbody id="results"></tbody>
</table>


<script>
  const API_URL = "https://worker.rrrase-holden.workers.dev/";

  const searchInput = document.getElementById("search");
  const itemsList = document.getElementById("items");
  const status = document.getElementById("status");

  let characters = [];

  async function loadItems() {

    try {
      const response = await fetch(API_URL);

      const data = await response.json();

      // Your API may return an array directly or wrap it in an object.
      characters = Array.isArray(data)
        ? data
        : data.results ?? data.data ?? [];


      displayItems(characters);
    } catch (error) {
      status.textContent = "Error";
    }
  }

  function displayItems(items) {
    itemsList.replaceChildren();

    if (items.length === 0) {
      status.textContent = "No codes found";
      return;
    }

    status.textContent = `${items.length} codes found`;

    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");

    for (const heading of ["Name", "Code", "Au"]) {
      const th = document.createElement("th");
      th.textContent = heading;
      headerRow.appendChild(th);
    }

    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");

    for (const item of items) {
      const row = document.createElement("tr");

      for (const value of [
        item.Name ?? item.name ?? "",
        item.Code ?? item.code ?? "",
        item.Au ?? item.au ?? ""
      ]) {
        const td = document.createElement("td");
        td.textContent = value ?? "";
        row.appendChild(td);
      }

      tbody.appendChild(row);
    }

    table.appendChild(tbody);

  }

  searchInput.addEventListener("input", () => {
    const query = searchInput.value.trim().toLowerCase();

    const filtered = characters.filter(item => {
      // Convert the name to a string and ignore capitalization/spacing.
      const name = String(item.Name ?? item.name ?? "").normalize("NFKC").trim().toLowerCase();

      return name.includes(query);
    });

    displayItems(filtered);
  });

  loadItems();
</script>

</body>
</html>
