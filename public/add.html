
<!DOCTYPE html>
<html lang="en">
<head>
  <title>D1 SQL Console</title>

</head>
<body>
  <h1>D1 SQL Console</h1>

  <label for="password">Admin password</label>
  <input
    id="password"
    type="password"
    placeholder="Enter admin password"
    autocomplete="current-password"
  >

  <div id="adder">
    <label for="sql">SQL Query</label>

    <textarea id="name" spellcheck="false">Name</textarea>
    <textarea id="au" spellcheck="false">Au</textarea>
    <textarea id="code" spellcheck="false">Code</textarea>

    <button id="execute">Execute SQL</button>
  </div>

  <div id="deller">
    <h2>Delete Character</h2>

    <label for="delName">Character name</label>
    <input id="delName" placeholder="Name to delete">

    <button id="delExecute">Delete Character</button>
  </div>

  <p id="status"></p>
  <pre id="output"></pre>

  <script>
    const API_URL =
      "https://worker.rrrase-holden.workers.dev/admin-sql";

    const password = document.getElementById("password");
    const addPanel = document.getElementById("adder");
    const delPanel = document.getElementById("deller");
    const status = document.getElementById("status");
    const output = document.getElementById("output");

    document.getElementById("unlock").addEventListener("click", () => {
      if (!password.value) {
        status.textContent = "Enter your password.";
        return;
      }

      addPanel.style.display = "block";
      status.textContent = "SQL console unlocked.";
    });

    async function executeSQL(sql, params) {
      status.textContent = "Executing query...";
      output.textContent = "";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${password.value}`
          },
          body: JSON.stringify({
            sql,
            params
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }

        status.textContent = "Query executed successfully.";
        output.textContent = JSON.stringify(data, null, 2);

      } catch (error) {
        status.textContent = `Error: ${error.message}`;
      }
    }

    document.getElementById("execute").addEventListener("click", () => {
      const name = document.getElementById("name").value;
      const au = document.getElementById("au").value;
      const code = document.getElementById("code").value;

      if (!name || !au || !code) {
        status.textContent = "Please fill in all fields.";
        return;
      }

      executeSQL(
        "INSERT INTO chars (Name, Au, Code) VALUES (?, ?, ?)",
        [name, au, code]
      );
    });

    document.getElementById("delExecute").addEventListener("click", () => {
      const name = document.getElementById("delName").value;

      if (!name) {
        status.textContent = "Enter a character name.";
        return;
      }

      if (!confirm(`Are you sure you want to delete ${name}?`)) {
        return;
      }

      executeSQL(
        "DELETE FROM chars WHERE Name = ?",
        [name]
      );
    });
  </script>
</body>
</html>
