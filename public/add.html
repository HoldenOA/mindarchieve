
<!DOCTYPE html>
<html lang="en">
<head>
  <title>D1 SQL Console</title>

</head>
<body>
  <h1>D1 SQL Console</h1>

  <label for="password">Admin password</label>
  <input
    id="password"
    type="password"
    placeholder="Enter admin password"
    autocomplete="current-password"
  >

  <button id="unlock">Unlock SQL Console</button>

  <div id="console">
    <label for="sql">SQL Query</label>

    <textarea id="sql" spellcheck="false">SELECT * FROM chars LIMIT 100;</textarea>

    <button id="execute">Execute SQL</button>
  </div>

  <p id="status"></p>
  <pre id="output"></pre>

  <script>
    const API_URL =
      "https://worker.rrrase-holden.workers.dev/admin-sql";

    const password = document.getElementById("password");
    const consolePanel = document.getElementById("console");
    const status = document.getElementById("status");
    const output = document.getElementById("output");

    document.getElementById("unlock").addEventListener("click", () => {
      if (!password.value) {
        status.textContent = "Enter your password.";
        return;
      }

      consolePanel.style.display = "block";
      status.textContent = "SQL console unlocked.";
    });

    document.getElementById("execute").addEventListener("click", async () => {
      status.textContent = "Executing query...";
      output.textContent = "";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${password.value}`
          },
          body: JSON.stringify({
            sql: "SELECT * from chars"
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }

        status.textContent = "Query executed successfully.";
        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
